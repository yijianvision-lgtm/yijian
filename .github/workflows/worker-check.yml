name: NEBULA local backend validation
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "nebula-local.js"
      - "deepseek-worker.js"
      - ".github/workflows/worker-check.yml"
  pull_request:
    paths:
      - "index.html"
      - "nebula-local.js"
      - "deepseek-worker.js"
      - ".github/workflows/worker-check.yml"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check local data module
        run: node --check nebula-local.js
      - name: Check DeepSeek Worker
        run: node --check deepseek-worker.js
      - name: Extract and check inline application script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/nebula-inline.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/nebula-inline.js

      - name: Check cognitive backend contract
        run: |
          python - <<'PY'
          from pathlib import Path
          local = Path("nebula-local.js").read_text(encoding="utf-8")
          html = Path("index.html").read_text(encoding="utf-8")
          worker = Path("deepseek-worker.js").read_text(encoding="utf-8")
          required_local = [
              'DB_VERSION = 6', 'lectureSources', 'aiConversations',
              'extractionBatches', 'extractionItems', 'filterCases', 'filterDecisions',
              'frameworks', 'frameworkVersions', 'nodePositions', 'relationEvidence', 'frameworkPlacements', 'explorationPaths', 'explorationSteps',
              'createExtractionFromParsedSource',
              'knowledgeRelations', 'nodeSourceLinks', 'knowledgeVersions',
              'reviewProposals', 'learningRecords', 'researchSessions',
              'exportFullBackup', 'previewFullBackup', 'restoreFullBackup',
              'findDuplicateCandidates', 'getCognitiveDashboard',
              'applyProposal', 'getNodeEvidence', 'createFrameworkPlacement', 'createExplorationPath', 'appendExplorationStep', 'forkExplorationPath'
          ]
          missing = [item for item in required_local if item not in local]
          if missing:
              raise SystemExit("Missing local backend contracts: " + ", ".join(missing))
          required_worker = ['"/analyze"', '"/coach"', '"/mnemonic"', '"/research"', '"/share"']
          missing = [item for item in required_worker if item not in worker]
          if missing:
              raise SystemExit("Missing Worker routes: " + ", ".join(missing))
          if 'exportFullBackup()' not in html or 'restoreFullBackup(parsed' not in html:
              raise SystemExit("Full backup UI hooks are not connected")
          print("NEBULA cognitive backend contract checks passed")
          PY
