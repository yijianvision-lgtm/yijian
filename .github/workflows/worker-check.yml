name: NEBULA local backend validation
on:
  push:
    branches: [main]
    paths:
      - "nebula-local.js"
      - "deepseek-worker.js"
      - ".github/workflows/worker-check.yml"
  pull_request:
    paths:
      - "nebula-local.js"
      - "deepseek-worker.js"
      - ".github/workflows/worker-check.yml"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check local data module
        run: node --check nebula-local.js
      - name: Check DeepSeek Worker
        run: node --check deepseek-worker.js
