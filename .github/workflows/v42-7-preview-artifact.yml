name: V42.7 isolated UI preview artifact

on:
  push:
    branches:
      - isolation/v42-7-core-menu-fixes
    paths:
      - ui-preview-v42-7.html
      - .github/workflows/v42-7-preview-artifact.yml

permissions:
  contents: read

jobs:
  package-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated V42.7 source
        uses: actions/checkout@v4

      - name: Set up Node for preview script checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify HTML and inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          p = Path("ui-preview-v42-7.html")
          html = p.read_text(encoding="utf-8")
          assert html.lower().lstrip().startswith("<!doctype html>"), "Missing HTML doctype"
          assert "<title>" in html.lower(), "Missing page title"
          assert "</html>" in html.lower(), "HTML document is incomplete"
          assert len(html) > 100_000, "Unexpectedly small preview file"

          scripts = [
              (attributes, source)
              for attributes, source in re.findall(r"<script\b([^>]*)>([\s\S]*?)</script>", html, re.I)
              if source.strip() and not re.search(r'type\s*=\s*["\']importmap["\']', attributes, re.I)
          ]
          assert scripts, "No inline JavaScript found"
          with tempfile.TemporaryDirectory() as tmp:
              for index, (attributes, source) in enumerate(scripts, 1):
                  script_path = Path(tmp) / f"inline-{index}.mjs"
                  script_path.write_text(source, encoding="utf-8")
                  result = subprocess.run(["node", "--check", str(script_path)], capture_output=True, text=True)
                  if result.returncode:
                      raise SystemExit(f"Inline script {index} ({attributes}) failed syntax check:\n{result.stderr}")

          print(f"V42.7 HTML verified: {len(html):,} characters")
          print(f"Inline JavaScript syntax passed: {len(scripts)} blocks")

      - name: Package the preview for local browser review
        run: |
          mkdir -p v42-7-preview-artifact
          cp ui-preview-v42-7.html v42-7-preview-artifact/
          cat > v42-7-preview-artifact/OPEN-ME.txt <<'EOF'
          GUANFU MIND V42.7 isolated UI preview

          1. Extract this ZIP archive.
          2. Open ui-preview-v42-7.html in a modern desktop browser.
          3. For a mobile layout check, use the browser's responsive device mode.

          This is an isolated UI preview only. It does not connect to or modify the formal backend,
          production knowledge data, the main branch, or the production website.
          Some visual/3D resources may require an internet connection.
          EOF

      - name: Upload downloadable V42.7 preview
        uses: actions/upload-artifact@v4
        with:
          name: guanfu-mind-v42-7-ui-preview
          path: v42-7-preview-artifact/
          if-no-files-found: error
          retention-days: 14
