name = "nebula-deepseek-bridge"
main = "deepseek-worker.js"
compatibility_date = "2026-11-06"
workers_dev = true

# Scheduled cleanup is inert until isolated test D1/R2 bindings are configured.
# It only processes upload intents at least one hour old, in batches of 50.
[triggers]
crons = ["*/15 * * * *"]

[vars]
DEEPSEEK_MODEL = "deepseek-v4-pro"

# Secrets are configured separately and are never committed:
# npx wrangler secret put DEEPSEEK_API_KEY
# npx wrangler secret put NEBULA_SYNC_TOKEN
# npx wrangler secret put CLAUDE_API_KEY

# Temporary per-IP/per-route abuse protection until verified user identities
# and per-account quotas are implemented. Confirm namespace_id is unused
# in this Cloudflare account before deploying.
[[ratelimits]]
name = "NEBULA_RATE_LIMITER"
namespace_id = "82640731"

  [ratelimits.simple]
  limit = 30
  period = 60

# Optional Clerk JWT mode. Do not enable until a real Clerk test instance,
# issuer/audience/JWKS and authorized-party values have been verified.
# [vars]
# NEBULA_AUTH_MODE = "clerk-jwt"
# NEBULA_JWT_ISSUER = "https://<verified-clerk-issuer>"
# NEBULA_JWT_AUDIENCE = "<verified-nebula-api-audience>"
# NEBULA_JWKS_URL = "https://<verified-clerk-jwks-endpoint>"
# NEBULA_AUTHORIZED_PARTIES = '["https://<approved-app-origin>"]'
# Configure NEBULA_OWNER_NAMESPACE_SECRET as a Worker secret (32+ random chars).

# Private sync bindings are intentionally not active until a separate test
# Cloudflare environment is approved and provisioned.
# [[d1_databases]]
# binding = "NEBULA_DB"
# database_name = "nebula-private-test"
# database_id = "<test-d1-database-id>"
#
# [[r2_buckets]]
# binding = "NEBULA_BUCKET"
# bucket_name = "nebula-private-test"
