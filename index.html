<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEBULA — 3D Knowledge Universe</title>
<meta name="description" content="A navigable 3D universe of knowledge.">
<style>
:root{--bg:#050711;--panel:rgba(12,18,38,.78);--line:rgba(139,164,255,.2);--text:#e8edff;--muted:#8e9abd;--cyan:#73e4ff;--violet:#b49aff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
#scene{position:fixed;inset:0}canvas{display:block}
.top{position:fixed;z-index:5;top:20px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.brand{pointer-events:auto;display:flex;align-items:center;gap:12px}.orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#7feaff 18%,#7356d9 48%,#11152f 75%);box-shadow:0 0 24px #7d77ff88}
h1{font-size:15px;letter-spacing:.22em;margin:0;font-weight:650}.sub{font-size:9px;letter-spacing:.2em;color:#8290b9;margin-top:4px}
.tools{display:flex;gap:8px;pointer-events:auto;align-items:center}.btn,.search{border:1px solid var(--line);background:rgba(10,16,34,.78);color:var(--text);border-radius:10px;padding:9px 12px;font-size:11px;backdrop-filter:blur(16px)}.btn{cursor:pointer}.btn:hover{border-color:#8a9dff;background:#172044}.search{width:190px;outline:none}.search::placeholder{color:#69769c}
.hint{position:fixed;z-index:3;left:25px;bottom:82px;color:#7481a5;font-size:10px;letter-spacing:.08em;line-height:1.8;pointer-events:none}
.stats{position:fixed;z-index:3;right:25px;bottom:85px;color:#8794b8;font-size:10px;text-align:right;line-height:1.8;pointer-events:none}
#panels{position:fixed;inset:0;pointer-events:none;z-index:4}
.panel{position:absolute;width:min(250px,27vw);padding:13px 15px;border:1px solid rgba(135,160,255,.3);border-radius:13px;background:linear-gradient(135deg,rgba(18,27,58,.92),rgba(8,13,29,.84));backdrop-filter:blur(18px);box-shadow:0 10px 40px #0008,inset 0 1px #ffffff0c;pointer-events:auto;transition:opacity .2s}
.panel h3{font-size:11px;letter-spacing:.12em;margin:0 0 7px;color:var(--cyan)}.panel p{font-size:11px;line-height:1.65;color:#c2cbe7;margin:0}.panel .tag{font-size:9px;color:#7383ae;margin-top:8px}
/* Four clear cardinal directions around the selected knowledge node; deliberately flat and readable. */
.panel.dir-up{left:50%;top:calc(50% - 225px);transform:translateX(-50%)}
.panel.dir-down{left:50%;top:calc(50% + 80px);transform:translateX(-50%)}
.panel.dir-left{left:calc(50% - 335px);top:50%;transform:translateY(-50%)}
.panel.dir-right{left:calc(50% + 85px);top:50%;transform:translateY(-50%)}
.panel.center-node{left:50%;top:50%;transform:translate(-50%,-50%);width:auto;min-width:130px;text-align:center;border-color:rgba(115,228,255,.6);box-shadow:0 0 35px #73e4ff30,0 10px 40px #0008}
@media(max-width:700px){
 .panel{width:min(42vw,210px);padding:9px}
 .panel p{font-size:10px}
 .panel.dir-up{top:calc(50% - 205px)}
 .panel.dir-down{top:calc(50% + 85px)}
 .panel.dir-left{left:2vw}
 .panel.dir-right{left:auto;right:2vw}
 .panel.center-node{min-width:95px}
}
#timeline{position:fixed;z-index:6;bottom:17px;left:50%;transform:translateX(-50%);width:min(680px,75vw);padding:11px 16px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(8,13,29,.78);backdrop-filter:blur(18px)}
.timehead{display:flex;justify-content:space-between;color:#8391b7;font-size:9px;letter-spacing:.15em;margin-bottom:9px}.events{display:flex;align-items:center;gap:0;position:relative}.events:before{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:linear-gradient(90deg,#5c68a0,#72dfff,#9e7aff)}.event{position:relative;flex:1;text-align:center;cursor:pointer;color:#8290b6;font-size:9px;padding-top:13px}.event:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#8c85ff;box-shadow:0 0 9px #8c85ff}.event.active{color:#e7f6ff}
#toast{position:fixed;z-index:10;top:76px;left:50%;transform:translateX(-50%);font-size:11px;color:#d9e6ff;background:#141d3b;border:1px solid #5468a0;border-radius:9px;padding:9px 13px;opacity:0;transition:opacity .2s;pointer-events:none}
#editor{position:fixed;z-index:8;inset:0;background:#02040bd9;display:none;align-items:center;justify-content:center}.dialog{width:min(440px,92vw);padding:22px;border:1px solid var(--line);border-radius:16px;background:#0b1126;box-shadow:0 20px 80px #000}.dialog h2{font-size:15px;margin:0 0 14px}.dialog input,.dialog textarea{width:100%;margin:5px 0 10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#080d1d;color:var(--text);font:inherit;font-size:11px}.dialog textarea{height:65px;resize:vertical}.dialog label{font-size:10px;color:#9aa8ca}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
#logical{display:none;position:fixed;inset:90px 5vw 110px;z-index:3;overflow:auto;padding:20px;border:1px solid var(--line);border-radius:16px;background:#080d1df2;backdrop-filter:blur(18px)}
.logic-tools{position:sticky;top:-20px;background:#0b1228f2;padding:13px 10px;z-index:3;display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ffffff18}
.logic-crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;font-size:11px;color:#9aa9ce;padding:3px 0 8px}.logic-crumb{cursor:pointer;color:#83dcff}.logic-crumb.current{color:#fff;cursor:default}
.logic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:18px 2px}
.logic-card{border:1px solid #53658f66;border-radius:13px;padding:15px;background:linear-gradient(145deg,#121d3b,#090f22);min-height:132px;display:flex;flex-direction:column;gap:9px;position:relative}
.logic-card.level-1{border-color:#63cfe788;box-shadow:inset 3px 0 #73e4ff}.logic-card.level-2{border-color:#a88cff88;box-shadow:inset 3px 0 #b49aff}.logic-card.level-3{border-color:#75d9b188;box-shadow:inset 3px 0 #78e2c2}
.logic-card-head{display:flex;gap:9px;align-items:flex-start}.logic-card-head input{margin-top:4px;accent-color:#73e4ff}.logic-card-main{flex:1;min-width:0}.logic-card strong{font-size:13px;line-height:1.5}.logic-card small{display:block;color:#8c9bc0;font-size:10px;line-height:1.6;margin-top:5px}
.logic-card-actions{display:flex;gap:7px;margin-top:auto;flex-wrap:wrap}.logic-card-actions button{font-size:10px;padding:7px 9px}
.logic-level{font-size:9px;color:#73e4ff;letter-spacing:.12em}.logic-empty{padding:36px;text-align:center;color:#8998bb;font-size:12px}
.logic-heading{font-size:17px;font-weight:650;margin:8px 0 0}.logic-subheading{font-size:10px;color:#8292b7;margin-top:5px}
.logic-count{font-size:10px;color:#aab8d8;margin-left:auto}
.logic-item{padding:12px 14px;border-bottom:1px solid #ffffff12;cursor:pointer;display:flex;align-items:flex-start;gap:10px}.logic-item strong{font-size:12px}.logic-item small{display:block;color:#8391b7;margin-top:5px;font-size:10px}.logic-item .logic-body{flex:1}.logic-item.level-1{border-left:2px solid #73e4ff}.logic-item.level-2{margin-left:22px;border-left:2px solid #b49aff}.logic-item.level-3{margin-left:44px;border-left:2px solid #78e2c2}.logic-tools{position:sticky;top:0;background:#0b1228;padding:10px;z-index:2;display:flex;gap:8px;align-items:center}.logic-item input{margin-top:3px;accent-color:#73e4ff}.level-tag{font-size:9px;color:#73e4ff;margin-left:8px}.thought-lines{margin-top:7px;padding:8px 10px;border-left:1px solid #53699b;color:#aebcdd;font-size:10px;line-height:1.7}.thought-lines summary{cursor:pointer;color:#a9baff}.thought-lines p{margin:5px 0}.import-options{display:grid;grid-template-columns:1fr;gap:9px;margin:12px 0}.import-options label{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;background:#080d1d}.import-options input{width:auto;margin:0}.dialog .help{font-size:10px;line-height:1.6;color:#8794b8}
@media(max-width:700px){.top{left:12px;right:12px;top:12px;align-items:flex-start}.sub{display:none}.tools{gap:5px;flex-wrap:wrap;justify-content:flex-end}.search{width:125px}.btn{padding:8px;font-size:10px}.panel{width:42vw;padding:9px}.panel p{font-size:10px}.hint{left:12px;bottom:92px}.stats{right:12px;bottom:92px}#timeline{width:94vw;bottom:9px}.event{font-size:8px}}
</style>
</head>

<div id="knowledgeEditor" style="position:fixed;z-index:9;inset:0;background:#02040be8;display:none;align-items:center;justify-content:center"><div class="dialog"><h2>输入新知识 · 自动整理进知识宇宙</h2><label>粘贴一段知识、文章摘录或学习笔记（可分段）</label><textarea id="knowledgeText" style="height:210px" placeholder="请粘贴知识内容；可用换行分隔不同主题。"></textarea><div class="actions"><button class="btn" id="cancelKnowledge">取消</button><button class="btn" id="processKnowledge">整理并加入宇宙</button></div><p style="font-size:10px;color:#8794b8;line-height:1.6">当前版本在浏览器本地按段落与句子拆分知识节点，生成四向思考初稿，并按关键词重合建立初步关系；不调用云端 AI，结果可继续编辑。</p></div></div><div id="importDialog" style="position:fixed;z-index:10;inset:0;background:#02040be8;display:none;align-items:center;justify-content:center"><div class="dialog"><h2>导入知识结构</h2><p class="help">选择导入内容类型。支持 JSON 文件；混合导入会尝试匹配节点、层级、逻辑关系和四向思维线。</p><div class="import-options"><label><input type="radio" name="importMode" value="logic" checked> <span><b>只导入逻辑链</b><br><small>知识节点、一级/二级/三级层级、父子与逻辑连线</small></span></label><label><input type="radio" name="importMode" value="thought"> <span><b>只导入思维线</b><br><small>前瞻、顾后、左顾、右盼，并匹配已有节点</small></span></label><label><input type="radio" name="importMode" value="mixed"> <span><b>混合导入</b><br><small>同时导入逻辑链和思维线，自动识别层级并建立对应关系</small></span></label></div><div class="actions"><button class="btn" id="cancelImport">取消</button><button class="btn" id="chooseImportFile">选择 JSON 文件</button></div></div></div><div id="editor"><div class="dialog"><h2 id="editorTitle">创建知识节点</h2><label>节点名称</label><input id="nodeName" placeholder="例如：系统思维"><label>简短描述</label><textarea id="nodeDesc" placeholder="这个知识点的核心是什么？"></textarea><label>前瞻 · 前置知识</label><textarea id="nodeBefore"></textarea><label>顾后 · 后续影响</label><textarea id="nodeAfter"></textarea><label>左顾 · 横向关联</label><textarea id="nodeLeft"></textarea><label>右盼 · 反向思考</label><textarea id="nodeRight"></textarea><div class="actions"><button class="btn" id="cancelEdit">取消</button><button class="btn" id="saveNode">保存节点</button></div></div></div>

{id:'n1',name:'系统思维',desc:'理解复杂系统中要素、关系、反馈与整体行为的思考方式。',x:0,y:0,z:0,color:0x76dfff,date:'1940s',before:'一般系统论、控制论与整体论为系统思维提供了基础。先理解要素、边界、关系和层级。',after:'可用于组织设计、政策分析、产品战略与复杂问题治理；进一步发展为系统动力学与复杂适应系统研究。',left:'与复杂性科学、生态学、网络科学、管理学相连。可比较还原论与整体论的解释边界。',right:'系统边界由观察者选择；整体视角可能掩盖个体差异，也可能因模型过度简化而忽略突发变化。'},

];

 nodes.forEach((n,i)=>{const g=new THREE.Group();g.position.set(n.x,n.y,n.z);const core=new THREE.Mesh(new THREE.SphereGeometry(n.id===selected?.id?1.55:1.08,32,32),new THREE.MeshStandardMaterial({color:n.color,emissive:n.color,emissiveIntensity:.55,roughness:.28,metalness:.18}));g.add(core);const halo=new THREE.Mesh(new THREE.SphereGeometry(1.65,24,24),new THREE.MeshBasicMaterial({color:n.color,transparent:true,opacity:.09,side:THREE.BackSide}));g.add(halo);const ring=new THREE.Mesh(new THREE.TorusGeometry(1.48,.018,6,80),new THREE.MeshBasicMaterial({color:n.color,transparent:true,opacity:.65}));ring.rotation.x=Math.PI/2.7;g.add(ring);g.userData.node=n;group.add(g);nodeMeshes.set(n.id,g);});

 renderLogical();renderTimeline();}
function renderTimeline(){const ev=document.querySelector('#events');ev.innerHTML='';nodes.filter(n=>n.date).slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(n=>{const e=document.createElement('div');e.className='event'+(selected?.id===n.id?' active':'');e.innerHTML='<span>'+n.date+'</span>';e.title=n.name;e.onclick=()=>select(n);ev.append(e);});}
function levelOf(n){const raw=n.level??n.depth??n.tier??n.rank;if(raw!==undefined){const m=String(raw).match(/[123]/);if(m)return Math.max(1,Math.min(3,Number(m[0])));}const t=String(n.name||'');const m=t.match(/^\\s*(?:(\\d+)[.、)）]|(一级|二级|三级|第一层|第二层|第三层))/);if(m){const v=m[1]?Number(m[1]):({'一级':1,'第一层':1,'二级':2,'第二层':2,'三级':3,'第三层':3}[m[2]]);return Math.max(1,Math.min(3,v));}return 1;}
function parentOf(n){const p=n.parentId??n.parent_id??n.parent; if(p!==undefined&&p!==null&&p!==''){return nodes.find(x=>x.id===p||x.name===p)||null;}return null;}
function childrenOf(parent){const targetLevel=parent?levelOf(parent)+1:1;let list=nodes.filter(n=>levelOf(n)===targetLevel&&(parentOf(n)?.id===(parent?.id||null)));if(parent&&list.length===0){const linked=links.map(l=>Array.isArray(l)?l:[l.source||l.from,l.target||l.to]).filter(l=>l[0]===parent.id).map(l=>l[1]);list=nodes.filter(n=>linked.includes(n.id)&&levelOf(n)===targetLevel);}return list.sort((a,b)=>String(a.name).localeCompare(String(b.name),'zh-CN'));}
function hierarchyPath(){const path=[];let n=currentParentId?nodes.find(x=>x.id===currentParentId):null;while(n){path.unshift(n);n=parentOf(n);}return path;}
function navigateInto(n){const kids=childrenOf(n);if(!kids.length){toast('这个节点目前没有下一层逻辑链');return;}currentParentId=n.id;renderLogical();}
function showThoughts(n){select(n);showPanels(n);toast('已展开「'+n.name+'」的四向思考');}
function renderLogical(){
 const parent=currentParentId?nodes.find(n=>n.id===currentParentId):null;const level=parent?levelOf(parent)+1:1;const list=childrenOf(parent);const path=hierarchyPath();
 const crumbs='<div class="logic-crumbs"><span class="logic-crumb" data-root="1">知识总览（一级）</span>'+path.map((n,i)=>'<span>›</span><span class="logic-crumb '+(i===path.length-1?'current':'')+'" data-crumb="'+esc(n.id)+'">'+esc(n.name)+'</span>').join('')+'</div>';
 const cards=list.map(n=>{const lv=levelOf(n),kids=childrenOf(n),thoughtCount=[n.before,n.after,n.left,n.right].filter(Boolean).length;return '<article class="logic-card level-'+lv+'" data-id="'+esc(n.id)+'"><div class="logic-card-head"><input type="checkbox" class="node-check" '+(selectedIds.has(n.id)?'checked':'')+' aria-label="选择 '+esc(n.name)+'"><div class="logic-card-main"><span class="logic-level">LEVEL '+lv+'</span><strong>'+esc(n.name)+'</strong><small>'+esc(n.desc||'尚未添加说明')+'</small></div></div><small>下一级节点：'+kids.length+'　·　四向思考：'+thoughtCount+'/4</small><div class="logic-card-actions"><button class="btn thought-btn">四向思考</button>'+(kids.length?'<button class="btn enter-btn">进入下一级　→</button>':'<button class="btn" disabled>暂无下一级</button>')+'</div></article>';}).join('');
 document.querySelector('#logical').innerHTML='<div class="logic-tools"><div class="logic-crumbs">'+crumbs+'</div><div class="logic-heading">'+(parent?esc(parent.name):'知识体系总览')+'</div><div class="logic-subheading">'+(parent?'当前层级：第 '+level+' 级 · 这里只显示当前节点的直接下级':'当前层级：第 1 级 · 先看主干，再逐层进入分支')+'</div><span class="logic-count">'+list.length+' 个节点</span><button class="btn" id="logicBack" '+(!parent?'disabled':'')+'>← 返回上一级</button><button class="btn" id="logicSelectAll">全选本层</button><button class="btn" id="logicDelete">批量删除（'+selectedIds.size+'）</button></div><div class="logic-grid">'+(cards||'<div class="logic-empty">这一层还没有节点。请导入带有 parentId / level 的层级数据，或在上一级节点下建立子节点。</div>')+'</div>';
 document.querySelectorAll('.logic-crumb[data-root]').forEach(el=>el.onclick=()=>{currentParentId=null;renderLogical();});
 document.querySelectorAll('.logic-crumb[data-crumb]').forEach(el=>el.onclick=()=>{currentParentId=el.dataset.crumb;renderLogical();});
 document.querySelector('#logicBack').onclick=()=>{currentParentId=parent?parentOf(parent)?.id||null:null;renderLogical();};
 document.querySelector('#logicSelectAll').onclick=()=>{list.forEach(n=>selectedIds.add(n.id));renderLogical();};
 document.querySelector('#logicDelete').onclick=bulkDelete;
 document.querySelectorAll('.logic-card').forEach(el=>{const n=nodes.find(x=>x.id===el.dataset.id);el.querySelector('.node-check').onchange=e=>{e.target.checked?selectedIds.add(n.id):selectedIds.delete(n.id);renderLogical();};el.querySelector('.thought-btn').onclick=()=>showThoughts(n);const enter=el.querySelector('.enter-btn');if(enter)enter.onclick=()=>navigateInto(n);el.querySelector('.logic-card-main').onclick=()=>showThoughts(n);});
}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function select(n){selected=n;build();showPanels(n);const obj=nodeMeshes.get(n.id);if(obj){const p=obj.position.clone();controls.target.copy(p);}}
function showPanels(n){
 const root=document.querySelector('#panels');root.innerHTML='';if(!n)return;
 const entries=[
  {title:'前瞻',tag:'PREREQUISITES',body:n.before,dir:'up'},
  {title:'顾后',tag:'CONSEQUENCES',body:n.after,dir:'down'},
  {title:'左顾',tag:'LATERAL LINKS',body:n.left,dir:'left'},
  {title:'右盼',tag:'COUNTERPOINTS',body:n.right,dir:'right'}
 ];
 entries.forEach(a=>{
  const d=document.createElement('div');d.className='panel dir-'+a.dir;
  d.innerHTML='<h3>'+a.title+'　/　'+a.tag+'</h3><p>'+esc(a.body||'尚未填写，可通过编辑节点补充。')+'</p><div class="tag">'+esc(n.name)+'</div>';
  root.append(d);
 });
 const title=document.createElement('div');title.className='panel center-node';
 title.innerHTML='<h3 style="margin:0;color:#fff">'+esc(n.name)+'</h3>';root.append(title);
}
function toggleView(){logical=!logical;document.querySelector('#logical').style.display=logical?'block':'none';document.querySelector('#scene').style.opacity=logical?'.18':'1';document.querySelector('#viewBtn').textContent=logical?'返回 3D 宇宙':'逻辑视图';if(logical)renderLogical();}
renderer.domElement.addEventListener('pointerdown',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(group.children,true);if(hits.length){let o=hits[0].object;while(o&&!o.userData.node)o=o.parent;if(o?.userData.node){if(multiSelectMode){const id=o.userData.node.id;selectedIds.has(id)?selectedIds.delete(id):selectedIds.add(id);renderLogical();toast('已选择 '+selectedIds.size+' 个节点');}else select(o.userData.node);}}});
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.opacity=1;setTimeout(()=>el.style.opacity=0,1900);}
document.querySelector('#resetBtn').onclick=()=>{camera.position.set(0,8,48);controls.target.set(0,0,0);controls.update();};
document.querySelector('#viewBtn').onclick=toggleView;
document.querySelector('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q)return;const n=nodes.find(x=>x.name.toLowerCase().includes(q)||x.desc?.toLowerCase().includes(q));if(n)select(n);};
document.querySelector('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:'0.3',nodes,links,thoughtLines:nodes.map(n=>({nodeId:n.id,nodeName:n.name,before:n.before,after:n.after,left:n.left,right:n.right})),hierarchy:nodes.map(n=>({id:n.id,name:n.name,level:levelOf(n)}))},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nebula-knowledge.json';a.click();URL.revokeObjectURL(a.href);toast('知识数据已导出');};
document.querySelector('#importBtn').onclick=()=>document.querySelector('#importDialog').style.display='flex';
document.querySelector('#cancelImport').onclick=()=>document.querySelector('#importDialog').style.display='none';
document.querySelector('#chooseImportFile').onclick=()=>document.querySelector('#importFile').click();
function normDirection(raw){const map={before:'before',prerequisite:'before',prerequisites:'before',前瞻:'before',前置:'before',after:'after',consequence:'after',consequences:'after',顾后:'after',后续:'after',left:'left',lateral:'left',左顾:'left',right:'right',counterpoint:'right',反向:'right',右盼:'right'};return map[String(raw||'').toLowerCase()]||null;}
function collectRecords(parsed){const raw=Array.isArray(parsed)?parsed:(parsed.nodes||parsed.logicChain||parsed.logicalChains||parsed.items||[]);return Array.isArray(raw)?raw:[];}
function importKnowledgeData(parsed,mode){
 const incoming=collectRecords(parsed),thoughts=parsed.thoughtLines||parsed.mindLines||parsed.thoughts||[];
 const findNode=(t)=>nodes.find(n=>n.id===t.nodeId||n.id===t.node_id||n.name===t.nodeName||n.name===t.node||n.name===t.name);
 let added=0,updated=0,thoughtUpdated=0;const idMap=new Map();const now=Date.now();
 if(mode!=='thought'){
  incoming.forEach((raw,i)=>{if(!raw||typeof raw!=='object')return;const name=String(raw.name||raw.title||raw.label||raw.text||'').trim();if(!name)return;const id=String(raw.id||('imp-'+now+'-'+i));const existing=nodes.find(n=>n.id===id)||nodes.find(n=>n.name===name);const n={...(existing||{}),...raw,id:existing?.id||id,name,desc:raw.desc||raw.description||raw.content||existing?.desc||'',x:Number(raw.x??existing?.x??(Math.cos(i*2.4)*(15+i*2))),y:Number(raw.y??existing?.y??((i%3-1)*7)),z:Number(raw.z??existing?.z??(Math.sin(i*2.4)*(15+i*2))),color:raw.color??existing?.color??0x76dfff,date:raw.date||existing?.date||'导入'};n.level=levelOf(raw);if(existing){Object.assign(existing,n);idMap.set(raw.id||name,existing.id);updated++;}else{nodes.push(n);idMap.set(raw.id||name,n.id);added++;}});
  const rawLinks=parsed.links||parsed.edges||[];rawLinks.forEach(l=>{const a=Array.isArray(l)?l[0]:(l.source||l.from||l.parentId),b=Array.isArray(l)?l[1]:(l.target||l.to||l.childId);const aa=idMap.get(a)||a,bb=idMap.get(b)||b;if(aa&&bb&&nodes.some(n=>n.id===aa)&&nodes.some(n=>n.id===bb)&&aa!==bb&&!links.some(x=>(Array.isArray(x)?x[0]:x.source||x.from)===aa&&(Array.isArray(x)?x[1]:x.target||x.to)===bb))links.push([aa,bb]);});
  // Infer parent-child edges from explicit parent references; keep hierarchy levels 1→2→3.
  incoming.forEach(raw=>{const child=idMap.get(raw.id)||nodes.find(n=>n.name===(raw.name||raw.title))?.id;const parentKey=raw.parentId||raw.parent_id||raw.parent;const parent=idMap.get(parentKey)||nodes.find(n=>n.name===parentKey)?.id;if(parent&&child&&parent!==child&&!links.some(l=>(Array.isArray(l)?l[0]:l.source||l.from)===parent&&(Array.isArray(l)?l[1]:l.target||l.to)===child))links.push([parent,child]);});
  if(mode==='logic')return {added,updated,thoughtUpdated};
 }
 if(mode!=='logic'){
  const list=[...thoughts,...incoming.filter(n=>n.thoughtLines||n.mindLines||n.before||n.after||n.left||n.right)];
  list.forEach(t=>{const target=findNode(t)||nodes.find(n=>n.id===t.nodeId)||nodes.find(n=>n.name===String(t.nodeName||t.node||t.name||'').trim());if(!target)return;let changed=false;const src=t.thoughtLines||t.mindLines||t.thoughts||t; if(Array.isArray(src)){src.forEach(x=>{const d=normDirection(x.direction||x.type||x.name);if(d&&x.content){target[d]=String(x.content);changed=true;}});}else{Object.entries(src).forEach(([k,v])=>{const d=normDirection(k);if(d&&typeof v==='string'){target[d]=v;changed=true;}});}if(changed){thoughtUpdated++;}});
 }
 return {added,updated,thoughtUpdated};
}
document.querySelector('#importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;const mode=document.querySelector('input[name="importMode"]:checked').value;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed)&&!parsed.nodes&&!parsed.items&&!parsed.logicChain&&!parsed.logicalChains&&!parsed.thoughtLines&&!parsed.mindLines&&!parsed.thoughts)throw new Error('文件中未识别到节点、逻辑链或思维线数据');const result=importKnowledgeData(parsed,mode);persist();build();if(nodes.length)select(nodes[nodes.length-1]);document.querySelector('#importDialog').style.display='none';toast('导入完成：新增 '+result.added+'，更新 '+result.updated+'，思维线匹配 '+result.thoughtUpdated);}catch(err){alert('导入失败：'+err.message);}finally{e.target.value='';}};
function openEditor(n=null){editing=n;document.querySelector('#editorTitle').textContent=n?'编辑知识节点':'创建知识节点';[['nodeName','name'],['nodeDesc','desc'],['nodeBefore','before'],['nodeAfter','after'],['nodeLeft','left'],['nodeRight','right']].forEach(([id,k])=>document.getElementById(id).value=n?.[k]||'');document.querySelector('#editor').style.display='flex';}
document.querySelector('#addBtn').onclick=()=>openEditor();document.querySelector('#cancelEdit').onclick=()=>document.querySelector('#editor').style.display='none';
document.querySelector('#editSelectedBtn').onclick=()=>{if(!selected)return toast('请先点击一个知识节点');openEditor(selected);};
function bulkDelete(){const ids=new Set(selectedIds);if(!ids.size&&selected)ids.add(selected.id);if(!ids.size)return toast('请先勾选要删除的节点');if(!confirm('确定批量删除 '+ids.size+' 个节点及其关联连线吗？'))return;nodes=nodes.filter(n=>!ids.has(n.id));links=links.filter(l=>!ids.has(Array.isArray(l)?l[0]:l.source||l.from)&&!ids.has(Array.isArray(l)?l[1]:l.target||l.to));if(selected&&ids.has(selected.id)){selected=null;showPanels(null);}ids.forEach(id=>selectedIds.delete(id));persist();build();if(!selected&&nodes.length)select(nodes[0]);toast('已批量删除 '+ids.size+' 个节点');}
document.querySelector('#multiSelectBtn').onclick=()=>{multiSelectMode=!multiSelectMode;document.querySelector('#multiSelectBtn').textContent=multiSelectMode?'退出多选':'多选模式';toast(multiSelectMode?'多选模式已开启：在逻辑视图勾选节点':'已退出多选模式');};
document.querySelector('#deleteSelectedBtn').onclick=bulkDelete;
document.querySelector('#knowledgeBtn').onclick=()=>document.querySelector('#knowledgeEditor').style.display='flex';document.querySelector('#cancelKnowledge').onclick=()=>document.querySelector('#knowledgeEditor').style.display='none';
function keywords(s){return (s.match(/[\u4e00-\u9fff]{2,}|[A-Za-z0-9]{3,}/g)||[]).map(x=>x.toLowerCase()).filter(x=>!['这个','因为','所以','我们','他们','以及','可以','通过','一个','进行','对于','这种','如果','但是','the','and','that','with'].includes(x));}
function ingestKnowledge(raw){
 const blocks=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);let chunks=[];
 blocks.forEach(b=>{if(b.length>180){chunks.push(...b.split(/(?<=[。！？.!?；;])/).map(x=>x.trim()).filter(Boolean));}else chunks.push(b);});
 chunks=chunks.filter(x=>x.length>=8).slice(0,20);if(!chunks.length)throw new Error('内容太短，请输入至少一个完整知识句子或段落');
 const created=chunks.map((txt,i)=>{const title=(txt.match(/^.{2,28}?(?=[，。；：、,.;:!?]|$)/)||[txt.slice(0,24)])[0].replace(/[。；：，、,.;:!?]+$/,'').trim()||('新知识 '+(i+1));const angle=Date.now()/1000+i*2.4;const radius=18+Math.sqrt(nodes.length+i)*2.4;return{id:'k'+Date.now()+'-'+i,name:title.slice(0,32),desc:txt,before:'前置线索：'+(i>0?chunks[i-1].slice(0,100):'关键词 '+keywords(txt).slice(0,5).join('、')+' 可作为追溯背景与基础概念的线索。'),after:'后续思考：这条知识可能如何影响后续概念、实践或决策？请结合上下文补充具体结果。',left:'横向关联线索：'+keywords(txt).slice(0,6).join('、')+'。可与知识宇宙中相近主题进行比较。',right:'反向检验：这一观点成立的条件是什么？是否存在反例、边界或替代解释？',x:Math.cos(angle)*radius,y:(Math.random()-.5)*22,z:Math.sin(angle)*radius,color:[0x76dfff,0xb59aff,0x78a8ff,0x78e2c2,0xe19bff][(nodes.length+i)%5],date:new Date().getFullYear()+' · 新增'};});
 created.forEach((n,i)=>{nodes.push(n);if(i>0)links.push([created[i-1].id,n.id]);});
 if(selected&&created.length)links.push([selected.id,created[0].id]);
 created.forEach(n=>{const kw=new Set(keywords(n.desc));const ranked=nodes.filter(o=>o.id!==n.id&&!created.some(v=>v.id===o.id)).map(o=>({o,score:keywords((o.name||'')+' '+(o.desc||'')).filter(k=>kw.has(k)).length})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,2);ranked.forEach(x=>links.push([n.id,x.o.id]));});
 persist();build();select(created[0]);return created.length;
}
document.querySelector('#processKnowledge').onclick=()=>{try{const count=ingestKnowledge(document.querySelector('#knowledgeText').value.trim());document.querySelector('#knowledgeText').value='';document.querySelector('#knowledgeEditor').style.display='none';toast('已整理 '+count+' 个知识节点并加入 3D 宇宙');}catch(err){toast(err.message);}};
document.querySelector('#saveNode').onclick=()=>{const v=id=>document.getElementById(id).value.trim();if(!v('nodeName'))return toast('请填写节点名称');if(editing){Object.assign(editing,{name:v('nodeName'),desc:v('nodeDesc'),before:v('nodeBefore'),after:v('nodeAfter'),left:v('nodeLeft'),right:v('nodeRight')});}else{const a=Math.random()*Math.PI*2,r=12+Math.random()*12;nodes.push({id:'n'+Date.now(),name:v('nodeName'),desc:v('nodeDesc'),before:v('nodeBefore'),after:v('nodeAfter'),left:v('nodeLeft'),right:v('nodeRight'),x:Math.cos(a)*r,y:(Math.random()-.5)*20,z:Math.sin(a)*r,color:[0x76dfff,0xb59aff,0x78a8ff,0x78e2c2][Math.floor(Math.random()*4)],date:'未标注'});}persist();document.querySelector('#editor').style.display='none';build();toast('节点已保存到此浏览器');};
window.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#editor').style.display='none';});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
try{build();select(nodes[0]);logical=true;document.querySelector('#logical').style.display='block';document.querySelector('#scene').style.opacity='.18';document.querySelector('#viewBtn').textContent='返回 3D 宇宙';renderLogical();}catch(err){console.error('NEBULA 初始化失败',err);toast('3D 初始化失败：请刷新页面或检查网络');}function animate(){requestAnimationFrame(animate);controls.update();group.children.forEach((o,i)=>{if(o.isGroup)o.rotation.y+=.0015;});renderer.render(scene,camera);}animate();
</script></body></html>
