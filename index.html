<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEBULA — 3D Knowledge Universe</title>
<meta name="description" content="A navigable 3D universe of knowledge.">
<style>
:root{--bg:#050711;--panel:rgba(12,18,38,.78);--line:rgba(139,164,255,.2);--text:#e8edff;--muted:#8e9abd;--cyan:#73e4ff;--violet:#b49aff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
#scene{position:fixed;inset:0}canvas{display:block}
.top{position:fixed;z-index:5;top:20px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.brand{pointer-events:auto;display:flex;align-items:center;gap:12px}.orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#7feaff 18%,#7356d9 48%,#11152f 75%);box-shadow:0 0 24px #7d77ff88}
h1{font-size:15px;letter-spacing:.22em;margin:0;font-weight:650}.sub{font-size:9px;letter-spacing:.2em;color:#8290b9;margin-top:4px}
.tools{display:flex;gap:8px;pointer-events:auto;align-items:center}.btn,.search{border:1px solid var(--line);background:rgba(10,16,34,.78);color:var(--text);border-radius:10px;padding:9px 12px;font-size:11px;backdrop-filter:blur(16px)}.btn{cursor:pointer}.btn:hover{border-color:#8a9dff;background:#172044}.search{width:190px;outline:none}.search::placeholder{color:#69769c}
.hint{position:fixed;z-index:3;left:25px;bottom:82px;color:#7481a5;font-size:10px;letter-spacing:.08em;line-height:1.8;pointer-events:none}
.stats{position:fixed;z-index:3;right:25px;bottom:85px;color:#8794b8;font-size:10px;text-align:right;line-height:1.8;pointer-events:none}
#panels{position:fixed;inset:0;pointer-events:none;z-index:4}.panel{position:absolute;width:min(230px,27vw);padding:13px 15px;border:1px solid rgba(135,160,255,.25);border-radius:13px;background:linear-gradient(135deg,rgba(18,27,58,.84),rgba(8,13,29,.72));backdrop-filter:blur(18px);box-shadow:0 10px 40px #0008, inset 0 1px #ffffff0c;pointer-events:auto;transition:opacity .2s}.panel h3{font-size:11px;letter-spacing:.12em;margin:0 0 7px;color:var(--cyan)}.panel p{font-size:11px;line-height:1.65;color:#c2cbe7;margin:0}.panel .tag{font-size:9px;color:#7383ae;margin-top:8px}
#timeline{position:fixed;z-index:6;bottom:17px;left:50%;transform:translateX(-50%);width:min(680px,75vw);padding:11px 16px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(8,13,29,.78);backdrop-filter:blur(18px)}
.timehead{display:flex;justify-content:space-between;color:#8391b7;font-size:9px;letter-spacing:.15em;margin-bottom:9px}.events{display:flex;align-items:center;gap:0;position:relative}.events:before{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:linear-gradient(90deg,#5c68a0,#72dfff,#9e7aff)}.event{position:relative;flex:1;text-align:center;cursor:pointer;color:#8290b6;font-size:9px;padding-top:13px}.event:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#8c85ff;box-shadow:0 0 9px #8c85ff}.event.active{color:#e7f6ff}
#toast{position:fixed;z-index:10;top:76px;left:50%;transform:translateX(-50%);font-size:11px;color:#d9e6ff;background:#141d3b;border:1px solid #5468a0;border-radius:9px;padding:9px 13px;opacity:0;transition:opacity .2s;pointer-events:none}
#editor{position:fixed;z-index:8;inset:0;background:#02040bd9;display:none;align-items:center;justify-content:center}.dialog{width:min(440px,92vw);padding:22px;border:1px solid var(--line);border-radius:16px;background:#0b1126;box-shadow:0 20px 80px #000}.dialog h2{font-size:15px;margin:0 0 14px}.dialog input,.dialog textarea{width:100%;margin:5px 0 10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#080d1d;color:var(--text);font:inherit;font-size:11px}.dialog textarea{height:65px;resize:vertical}.dialog label{font-size:10px;color:#9aa8ca}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
#logical{display:none;position:fixed;inset:90px 8vw 110px;z-index:3;overflow:auto;padding:20px;border:1px solid var(--line);border-radius:16px;background:#080d1ddd;backdrop-filter:blur(18px)}.logic-item{padding:12px 14px;border-bottom:1px solid #ffffff12;cursor:pointer}.logic-item strong{font-size:12px}.logic-item small{display:block;color:#8391b7;margin-top:5px;font-size:10px}
@media(max-width:700px){.top{left:12px;right:12px;top:12px;align-items:flex-start}.sub{display:none}.tools{gap:5px;flex-wrap:wrap;justify-content:flex-end}.search{width:125px}.btn{padding:8px;font-size:10px}.panel{width:42vw;padding:9px}.panel p{font-size:10px}.hint{left:12px;bottom:92px}.stats{right:12px;bottom:92px}#timeline{width:94vw;bottom:9px}.event{font-size:8px}}
</style>
</head>
<body>
<div id="scene"></div>
<header class="top"><div class="brand"><div class="orb"></div><div><h1>NEBULA</h1><div class="sub">3D KNOWLEDGE UNIVERSE · v0.1</div></div></div>
<div class="tools"><input id="search" class="search" placeholder="搜索知识节点…"><button class="btn" id="viewBtn">逻辑视图</button><button class="btn" id="addBtn">＋ 新节点</button><button class="btn" id="importBtn">导入知识</button><input id="importFile" type="file" accept=".json,application/json" hidden><button class="btn" id="exportBtn">导出 JSON</button><button class="btn" id="resetBtn">重置视角</button></div></header>
<div class="hint">拖拽 · 旋转空间　 滚轮 · 缩放　 点击星体 · 探索知识<br>节点在真实 XYZ 空间分布，可从不同深度观察</div>
<div class="stats" id="stats"></div><div id="panels"></div><div id="logical"></div><div id="toast"></div>
<div id="timeline"><div class="timehead"><span>KNOWLEDGE TIMELINE</span><span>点击事件定位节点</span></div><div class="events" id="events"></div></div>
<div id="editor"><div class="dialog"><h2 id="editorTitle">创建知识节点</h2><label>节点名称</label><input id="nodeName" placeholder="例如：系统思维"><label>简短描述</label><textarea id="nodeDesc" placeholder="这个知识点的核心是什么？"></textarea><label>前瞻 · 前置知识</label><textarea id="nodeBefore"></textarea><label>顾后 · 后续影响</label><textarea id="nodeAfter"></textarea><label>左顾 · 横向关联</label><textarea id="nodeLeft"></textarea><label>右盼 · 反向思考</label><textarea id="nodeRight"></textarea><div class="actions"><button class="btn" id="cancelEdit">取消</button><button class="btn" id="saveNode">保存节点</button></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const seed=[
{id:'n1',name:'系统思维',desc:'理解复杂系统中要素、关系、反馈与整体行为的思考方式。',x:0,y:0,z:0,color:0x76dfff,date:'1940s',before:'一般系统论、控制论与整体论为系统思维提供了基础。先理解要素、边界、关系和层级。',after:'可用于组织设计、政策分析、产品战略与复杂问题治理；进一步发展为系统动力学与复杂适应系统研究。',left:'与复杂性科学、生态学、网络科学、管理学相连。可比较还原论与整体论的解释边界。',right:'系统边界由观察者选择；整体视角可能掩盖个体差异，也可能因模型过度简化而忽略突发变化。'},
{id:'n2',name:'第一性原理',desc:'回到最基本、不可再简化的事实，从底层约束重新推导问题。',x:-15,y:8,z:-9,color:0xb59aff,date:'古典哲学',before:'可追溯到古希腊哲学对本原与基本命题的追问，也依赖逻辑学、科学方法和证据意识。',after:'帮助拆解惯例、识别真实约束，常用于工程创新、商业模式重构与战略决策。',left:'关联科学方法、批判性思维、数学公理化方法和设计思维。',right:'并非所有问题都能从零推导；忽略经验、路径依赖与社会情境会造成低效甚至错误。'},
{id:'n3',name:'反馈回路',desc:'系统输出反过来影响输入，形成强化或调节机制。',x:13,y:10,z:8,color:0x78a8ff,date:'1940s–',before:'理解因果关系、时间延迟、系统边界；控制论与早期自动控制研究是重要来源。',after:'可解释增长、衰退、市场循环、生态平衡与组织行为，也是系统动力学建模的核心工具。',left:'与控制论、神经科学、生态学、经济学中的预期和价格机制相关。',right:'识别出相关性不等于证明反馈因果；延迟、非线性和外部冲击可能改变回路效果。'},
{id:'n4',name:'复杂适应系统',desc:'由多个主体局部互动而涌现出宏观秩序与适应行为。',x:4,y:-14,z:-13,color:0xe19bff,date:'1970s–',before:'依赖复杂性、非线性动力学、演化理论、计算模拟与多主体互动研究。',after:'应用于城市、金融市场、互联网生态、免疫系统和组织创新。',left:'与涌现、自组织、网络科学、演化博弈及人工生命密切关联。',right:'涌现概念容易被泛化；模型结果高度依赖主体规则、初始条件与尺度选择。'},
{id:'n5',name:'认知偏差',desc:'人在判断与决策中出现的系统性偏离，并非随机误差。',x:-10,y:-12,z:14,color:0xffc47b,date:'1970s–',before:'概率论、统计学、心理物理学与行为决策研究构成其知识基础。',after:'影响投资、管理、公共政策、产品体验和个人判断；推动行为经济学发展。',left:'关联启发式、损失厌恶、贝叶斯推断、注意力机制与社会心理学。',right:'偏差分类受实验情境影响；不能把所有非理性行为都归结为偏差，也要考虑环境是否合理。'},
{id:'n6',name:'知识图谱',desc:'以实体、概念和关系构成可查询、可推理的结构化知识网络。',x:18,y:-5,z:-5,color:0x74e6c1,date:'2010s–',before:'图论、语义网、本体工程、数据库与自然语言处理提供基础。',after:'可用于搜索、问答、推荐、科研知识组织与个人知识管理。',left:'关联语义网络、向量数据库、分类体系、思维导图与本体论。',right:'关系定义与数据质量决定图谱价值；过度结构化会增加维护成本，图谱也不自动等于理解。'}
];
let nodes=JSON.parse(localStorage.getItem('nebula_nodes')||'null')||seed;
const links=[['n1','n2'],['n1','n3'],['n1','n4'],['n1','n6'],['n3','n4'],['n2','n5'],['n5','n6'],['n3','n6']];
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050711);scene.fog=new THREE.FogExp2(0x050711,.008);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1000);camera.position.set(0,8,48);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.querySelector('#scene').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.055;controls.minDistance=12;controls.maxDistance=100;
scene.add(new THREE.AmbientLight(0x7788bb,1.3));const light=new THREE.PointLight(0x8b8cff,90,100);light.position.set(0,15,20);scene.add(light);
const starGeo=new THREE.BufferGeometry(),starPos=[];for(let i=0;i<1800;i++)starPos.push((Math.random()-.5)*180,(Math.random()-.5)*130,(Math.random()-.5)*180);starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0x8299d9,size:.13,transparent:true,opacity:.72})));
const group=new THREE.Group();scene.add(group);const nodeMeshes=new Map(),ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let selected=null,logical=false,editing=null;
function persist(){localStorage.setItem('nebula_nodes',JSON.stringify(nodes));}
function build(){while(group.children.length)group.remove(group.children[0]);nodeMeshes.clear();
 const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
 links.forEach(([a,b])=>{if(!byId[a]||!byId[b])return;const pts=[new THREE.Vector3(byId[a].x,byId[a].y,byId[a].z),new THREE.Vector3(byId[b].x,byId[b].y,byId[b].z)];const geo=new THREE.BufferGeometry().setFromPoints(pts);group.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x667eea,transparent:true,opacity:.28})));});
 nodes.forEach((n,i)=>{const g=new THREE.Group();g.position.set(n.x,n.y,n.z);const core=new THREE.Mesh(new THREE.SphereGeometry(n.id===selected?.id?1.55:1.08,32,32),new THREE.MeshStandardMaterial({color:n.color,emissive:n.color,emissiveIntensity:.55,roughness:.28,metalness:.18}));g.add(core);const halo=new THREE.Mesh(new THREE.SphereGeometry(1.65,24,24),new THREE.MeshBasicMaterial({color:n.color,transparent:true,opacity:.09,side:THREE.BackSide}));g.add(halo);const ring=new THREE.Mesh(new THREE.TorusGeometry(1.48,.018,6,80),new THREE.MeshBasicMaterial({color:n.color,transparent:true,opacity:.65}));ring.rotation.x=Math.PI/2.7;g.add(ring);g.userData.node=n;group.add(g);nodeMeshes.set(n.id,g);});
 document.querySelector('#stats').textContent=nodes.length+' KNOWLEDGE NODES  ·  XYZ SPACE  ·  LOCAL SAVE';
 renderLogical();renderTimeline();}
function renderTimeline(){const ev=document.querySelector('#events');ev.innerHTML='';nodes.filter(n=>n.date).slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(n=>{const e=document.createElement('div');e.className='event'+(selected?.id===n.id?' active':'');e.innerHTML='<span>'+n.date+'</span>';e.title=n.name;e.onclick=()=>select(n);ev.append(e);});}
function renderLogical(){document.querySelector('#logical').innerHTML=nodes.map(n=>'<div class="logic-item" data-id="'+n.id+'"><strong>'+esc(n.name)+'</strong><small>'+esc(n.desc||'')+'　·　XYZ ('+[n.x,n.y,n.z].map(v=>Number(v).toFixed(1)).join(', ')+')</small></div>').join('');document.querySelectorAll('.logic-item').forEach(el=>el.onclick=()=>{const n=nodes.find(x=>x.id===el.dataset.id);select(n);logical=false;toggleView();});}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function select(n){selected=n;build();showPanels(n);const obj=nodeMeshes.get(n.id);if(obj){const p=obj.position.clone();controls.target.copy(p);}}
function showPanels(n){const root=document.querySelector('#panels');root.innerHTML='';if(!n)return;const entries=[['前瞻',n.before,'PREREQUISITES'],['顾后',n.after,'CONSEQUENCES'],['左顾',n.left,'LATERAL LINKS'],['右盼',n.right,'COUNTERPOINTS']];const positions=[['calc(50% - 255px)','calc(50% - 170px)'],['calc(50% + 25px)','calc(50% - 170px)'],['calc(50% - 255px)','calc(50% + 25px)'],['calc(50% + 25px)','calc(50% + 25px)']];entries.forEach((a,i)=>{const d=document.createElement('div');d.className='panel';d.style.left=positions[i][0];d.style.top=positions[i][1];d.innerHTML='<h3>'+a[0]+'　/　'+a[2]+'</h3><p>'+esc(a[1]||'尚未填写，可通过编辑节点补充。')+'</p><div class="tag">'+esc(n.name)+'</div>';root.append(d);});const title=document.createElement('div');title.className='panel';title.style.left='50%';title.style.top='calc(50% - 28px)';title.style.transform='translate(-50%,-50%)';title.style.width='auto';title.style.textAlign='center';title.innerHTML='<h3 style="margin:0;color:#fff">'+esc(n.name)+'</h3>';root.append(title);}
function toggleView(){logical=!logical;document.querySelector('#logical').style.display=logical?'block':'none';document.querySelector('#scene').style.opacity=logical?'.18':'1';document.querySelector('#viewBtn').textContent=logical?'返回 3D 宇宙':'逻辑视图';}
renderer.domElement.addEventListener('pointerdown',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(group.children,true);if(hits.length){let o=hits[0].object;while(o&&!o.userData.node)o=o.parent;if(o?.userData.node)select(o.userData.node);}});
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.opacity=1;setTimeout(()=>el.style.opacity=0,1900);}
document.querySelector('#resetBtn').onclick=()=>{camera.position.set(0,8,48);controls.target.set(0,0,0);controls.update();};
document.querySelector('#viewBtn').onclick=toggleView;
document.querySelector('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q)return;const n=nodes.find(x=>x.name.toLowerCase().includes(q)||x.desc?.toLowerCase().includes(q));if(n)select(n);};
document.querySelector('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:'0.1',nodes,links},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nebula-knowledge.json';a.click();URL.revokeObjectURL(a.href);toast('知识数据已导出');};
document.querySelector('#importBtn').onclick=()=>document.querySelector('#importFile').click();
document.querySelector('#importFile').onchange=async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try{
  const parsed=JSON.parse(await file.text());
  const incoming=Array.isArray(parsed)?parsed:parsed.nodes;
  if(!Array.isArray(incoming)||incoming.length===0)throw new Error('文件中没有可导入的知识节点');
  const valid=incoming.filter(n=>n&&typeof n==='object'&&typeof n.name==='string'&&n.name.trim());
  if(valid.length!==incoming.length)throw new Error('部分节点缺少有效名称，已取消导入');
  if(!confirm('检测到 '+valid.length+' 个节点。将与当前知识合并；相同 ID 的节点会更新，其他节点会新增。继续吗？'))return;
  const byId=new Map(nodes.map((n,i)=>[n.id,i]));
  let added=0,updated=0;
  valid.forEach((raw,i)=>{
   const n={...raw};
   if(!n.id)n.id='import-'+Date.now()+'-'+i;
   if(byId.has(n.id)){nodes[byId.get(n.id)]={...nodes[byId.get(n.id)],...n};updated++;}
   else{byId.set(n.id,nodes.length);nodes.push(n);added++;}
  });
  const incomingLinks=Array.isArray(parsed.links)?parsed.links:[];
  const signature=l=>Array.isArray(l)?l.slice(0,2).join('::'):((l.source||l.from||'')+'::'+(l.target||l.to||''));
  const seen=new Set(links.map(signature));
  incomingLinks.forEach(l=>{if((Array.isArray(l)&&l.length>=2)||(!Array.isArray(l)&&(l.source||l.from)&&(l.target||l.to))){const k=signature(l);if(!seen.has(k)){links.push(l);seen.add(k);}}});
  persist();build();if(nodes.length)select(nodes[nodes.length-1]);
  toast('导入完成：新增 '+added+'，更新 '+updated);
 }catch(err){alert('导入失败：'+err.message);}
 finally{e.target.value='';}
};
function openEditor(n=null){editing=n;document.querySelector('#editorTitle').textContent=n?'编辑知识节点':'创建知识节点';[['nodeName','name'],['nodeDesc','desc'],['nodeBefore','before'],['nodeAfter','after'],['nodeLeft','left'],['nodeRight','right']].forEach(([id,k])=>document.getElementById(id).value=n?.[k]||'');document.querySelector('#editor').style.display='flex';}
document.querySelector('#addBtn').onclick=()=>openEditor();document.querySelector('#cancelEdit').onclick=()=>document.querySelector('#editor').style.display='none';
document.querySelector('#saveNode').onclick=()=>{const v=id=>document.getElementById(id).value.trim();if(!v('nodeName'))return toast('请填写节点名称');if(editing){Object.assign(editing,{name:v('nodeName'),desc:v('nodeDesc'),before:v('nodeBefore'),after:v('nodeAfter'),left:v('nodeLeft'),right:v('nodeRight')});}else{const a=Math.random()*Math.PI*2,r=12+Math.random()*12;nodes.push({id:'n'+Date.now(),name:v('nodeName'),desc:v('nodeDesc'),before:v('nodeBefore'),after:v('nodeAfter'),left:v('nodeLeft'),right:v('nodeRight'),x:Math.cos(a)*r,y:(Math.random()-.5)*20,z:Math.sin(a)*r,color:[0x76dfff,0xb59aff,0x78a8ff,0x78e2c2][Math.floor(Math.random()*4)],date:'未标注'});}persist();document.querySelector('#editor').style.display='none';build();toast('节点已保存到此浏览器');};
window.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#editor').style.display='none';});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
build();select(nodes[0]);function animate(){requestAnimationFrame(animate);controls.update();group.children.forEach((o,i)=>{if(o.isGroup)o.rotation.y+=.0015;});renderer.render(scene,camera);}animate();
</script></body></html>
