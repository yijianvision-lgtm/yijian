<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEBULA — 3D Knowledge Universe</title>
<meta name="description" content="A navigable 3D universe of knowledge.">
<style>
:root{--bg:#050711;--panel:rgba(12,18,38,.78);--line:rgba(139,164,255,.2);--text:#e8edff;--muted:#8e9abd;--cyan:#73e4ff;--violet:#b49aff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
#scene{position:fixed;inset:0}canvas{display:block}
.top{position:fixed;z-index:5;top:20px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.brand{pointer-events:auto;display:flex;align-items:center;gap:12px}.orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#7feaff 18%,#7356d9 48%,#11152f 75%);box-shadow:0 0 24px #7d77ff88}
h1{font-size:15px;letter-spacing:.22em;margin:0;font-weight:650}.sub{font-size:9px;letter-spacing:.2em;color:#8290b9;margin-top:4px}
.tools{display:flex;gap:8px;pointer-events:auto;align-items:center}.btn,.search{border:1px solid var(--line);background:rgba(10,16,34,.78);color:var(--text);border-radius:10px;padding:9px 12px;font-size:11px;backdrop-filter:blur(16px)}.btn{cursor:pointer}.btn:hover{border-color:#8a9dff;background:#172044}.search{width:190px;outline:none}.search::placeholder{color:#69769c}
.hint{position:fixed;z-index:3;left:25px;bottom:82px;color:#7481a5;font-size:10px;letter-spacing:.08em;line-height:1.8;pointer-events:none}
.stats{position:fixed;z-index:3;right:25px;bottom:85px;color:#8794b8;font-size:10px;text-align:right;line-height:1.8;pointer-events:none}
#panels{position:fixed;inset:0;pointer-events:none;z-index:4}
.panel{position:absolute;width:min(250px,27vw);padding:13px 15px;border:1px solid rgba(135,160,255,.3);border-radius:13px;background:linear-gradient(135deg,rgba(18,27,58,.92),rgba(8,13,29,.84));backdrop-filter:blur(18px);box-shadow:0 10px 40px #0008,inset 0 1px #ffffff0c;pointer-events:auto;transition:opacity .2s}
.panel h3{font-size:11px;letter-spacing:.12em;margin:0 0 9px;color:var(--cyan)}.panel p{font-size:11px;line-height:1.65;color:#c2cbe7;margin:0}.thought-content{display:flex;flex-direction:column;gap:7px}.thought-main{font-size:13px;line-height:1.65;font-weight:750;color:#f2f6ff;text-shadow:0 0 12px #ffffff18}.thought-detail{font-size:10px;line-height:1.7;color:#9eaccd;font-weight:400;border-left:1px solid #ffffff24;padding-left:9px}.thought-detail p{font-size:10px;color:#9eaccd;font-weight:350;margin:0 0 4px}.thought-main strong{font-size:14px;font-weight:800;color:#fff;text-shadow:0 0 14px #ffffff30}.thought-detail .detail-label{display:block;color:#d3dcf5;font-weight:650;font-size:9px;letter-spacing:.06em;margin-bottom:2px}.thought-detail p span{font-weight:400;color:#aab7d5}.panel .tag{font-size:9px;color:#7383ae;margin-top:8px}
/* Four clear cardinal directions around the selected knowledge node; deliberately flat and readable. */
.panel.dir-up{left:50%;top:calc(50% - 225px);transform:translateX(-50%)}
.panel.dir-down{left:50%;top:calc(50% + 80px);transform:translateX(-50%)}
.panel.dir-left{left:calc(50% - 335px);top:50%;transform:translateY(-50%)}
.panel.dir-right{left:calc(50% + 85px);top:50%;transform:translateY(-50%)}
.panel.center-node{left:50%;top:50%;transform:translate(-50%,-50%);width:auto;min-width:130px;text-align:center;border-color:rgba(115,228,255,.6);box-shadow:0 0 35px #73e4ff30,0 10px 40px #0008}
@media(max-width:700px){
 .panel{width:min(42vw,210px);padding:9px}
 .panel p{font-size:10px}
 .panel.dir-up{top:calc(50% - 205px)}
 .panel.dir-down{top:calc(50% + 85px)}
 .panel.dir-left{left:2vw}
 .panel.dir-right{left:auto;right:2vw}
 .panel.center-node{min-width:95px}
}
#timeline{position:fixed;z-index:6;bottom:17px;left:50%;transform:translateX(-50%);width:min(680px,75vw);padding:11px 16px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(8,13,29,.78);backdrop-filter:blur(18px)}
.timehead{display:flex;justify-content:space-between;color:#8391b7;font-size:9px;letter-spacing:.15em;margin-bottom:9px}.events{display:flex;align-items:center;gap:0;position:relative}.events:before{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:linear-gradient(90deg,#5c68a0,#72dfff,#9e7aff)}.event{position:relative;flex:1;text-align:center;cursor:pointer;color:#8290b6;font-size:9px;padding-top:13px}.event:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#8c85ff;box-shadow:0 0 9px #8c85ff}.event.active{color:#e7f6ff}
#toast{position:fixed;z-index:10;top:76px;left:50%;transform:translateX(-50%);font-size:11px;color:#d9e6ff;background:#141d3b;border:1px solid #5468a0;border-radius:9px;padding:9px 13px;opacity:0;transition:opacity .2s;pointer-events:none}
#editor{position:fixed;z-index:8;inset:0;background:#02040bd9;display:none;align-items:center;justify-content:center}.dialog{width:min(440px,92vw);padding:22px;border:1px solid var(--line);border-radius:16px;background:#0b1126;box-shadow:0 20px 80px #000}.dialog h2{font-size:15px;margin:0 0 14px}.dialog input,.dialog textarea,.dialog select{width:100%;margin:5px 0 10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#080d1d;color:var(--text);font:inherit;font-size:11px}.dialog textarea{height:65px;resize:vertical}.dialog label{font-size:10px;color:#9aa8ca}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
#logical{display:none;position:fixed;inset:90px 5vw 110px;z-index:3;overflow:auto;padding:20px;border:1px solid var(--line);border-radius:16px;background:#080d1df2;backdrop-filter:blur(18px)}
.logic-tools{position:sticky;top:-20px;background:#0b1228f2;padding:13px 10px;z-index:3;display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ffffff18}
.logic-crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;font-size:11px;color:#9aa9ce;padding:3px 0 8px}.logic-crumb{cursor:pointer;color:#83dcff}.logic-crumb.current{color:#fff;cursor:default}
.logic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:18px 2px}
.logic-card{border:1px solid #53658f66;border-radius:13px;padding:15px;background:linear-gradient(145deg,#121d3b,#090f22);min-height:132px;display:flex;flex-direction:column;gap:9px;position:relative;box-shadow:0 0 14px #ffffff08,inset 0 0 12px #ffffff05}
.logic-card.level-1{border-color:#63cfe788;box-shadow:inset 3px 0 #73e4ff}.logic-card.level-2{border-color:#a88cff88;box-shadow:inset 3px 0 #b49aff}.logic-card.level-3{border-color:#75d9b188;box-shadow:inset 3px 0 #78e2c2}
.logic-card-head{display:flex;gap:9px;align-items:flex-start}.logic-card-head input{margin-top:4px;accent-color:#73e4ff}.logic-card-main{flex:1;min-width:0}.logic-card strong{font-size:13px;line-height:1.5}.logic-card small{display:block;color:#8c9bc0;font-size:10px;line-height:1.6;margin-top:5px}
.logic-card-actions{display:flex;gap:7px;margin-top:auto;flex-wrap:wrap}.logic-card-actions button{font-size:10px;padding:7px 9px}
.logic-level{font-size:9px;color:#73e4ff;letter-spacing:.12em}.logic-level.level-1{color:#73e4ff;font-weight:800}.logic-level.level-2{color:#c2aaff;font-weight:700}.logic-level.level-3{color:#8ce8ca;font-weight:600}.logic-legend{display:flex;gap:12px;flex-wrap:wrap;padding:12px 2px 0;color:#9aa9ce;font-size:10px}.logic-legend .l1{color:#73e4ff}.logic-legend .l2{color:#c2aaff}.logic-legend .l3{color:#8ce8ca}.logic-empty{padding:36px;text-align:center;color:#8998bb;font-size:12px}
.logic-heading{font-size:17px;font-weight:650;margin:8px 0 0}.logic-subheading{font-size:10px;color:#8292b7;margin-top:5px}
.logic-count{font-size:10px;color:#aab8d8;margin-left:auto}
.logic-item{padding:12px 14px;border-bottom:1px solid #ffffff12;cursor:pointer;display:flex;align-items:flex-start;gap:10px}.logic-item strong{font-size:12px}.logic-item small{display:block;color:#8391b7;margin-top:5px;font-size:10px}.logic-item .logic-body{flex:1}.logic-item.level-1{border-left:2px solid #73e4ff}.logic-item.level-2{margin-left:22px;border-left:2px solid #b49aff}.logic-item.level-3{margin-left:44px;border-left:2px solid #78e2c2}.logic-tools{position:sticky;top:0;background:#0b1228;padding:10px;z-index:2;display:flex;gap:8px;align-items:center}.logic-item input{margin-top:3px;accent-color:#73e4ff}.level-tag{font-size:9px;color:#73e4ff;margin-left:8px}.thought-lines{margin-top:7px;padding:8px 10px;border-left:1px solid #53699b;color:#aebcdd;font-size:10px;line-height:1.7}.thought-lines summary{cursor:pointer;color:#a9baff}.thought-lines p{margin:5px 0}.import-options{display:grid;grid-template-columns:1fr;gap:9px;margin:12px 0}.import-options label{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;background:#080d1d}.import-options input{width:auto;margin:0}.dialog .help{font-size:10px;line-height:1.6;color:#8794b8}
@media(max-width:700px){.top{left:12px;right:12px;top:12px;align-items:flex-start}.sub{display:none}.tools{gap:5px;flex-wrap:wrap;justify-content:flex-end}.search{width:125px}.btn{padding:8px;font-size:10px}.panel{width:42vw;padding:9px}.panel p{font-size:10px}.hint{left:12px;bottom:92px}.stats{right:12px;bottom:92px}#timeline{width:94vw;bottom:9px}.event{font-size:8px}}
</style>
</head>
<body>
<div id="scene"></div>
<header class="top"><div class="brand"><div class="orb"></div><div><h1>NEBULA</h1><div class="sub">3D KNOWLEDGE UNIVERSE · v0.7</div></div></div>
<div class="tools"><input id="search" class="search" placeholder="搜索知识节点…"><button class="btn" id="viewBtn">逻辑视图</button><button class="btn" id="addBtn">＋ 新节点</button><button class="btn" id="editSelectedBtn">编辑选中</button><button class="btn" id="multiSelectBtn">多选模式</button><button class="btn" id="deleteSelectedBtn">批量删除</button><button class="btn" id="knowledgeBtn">输入知识</button><button class="btn" id="importBtn">导入知识</button><input id="importFile" type="file" accept=".json,application/json" hidden><button class="btn" id="exportBtn">导出 JSON</button><button class="btn" id="resetBtn">重置视角</button></div></header>
<div class="hint">拖拽 · 旋转空间　 滚轮 · 缩放　 点击星体 · 探索知识<br>节点在真实 XYZ 空间分布，可从不同深度观察</div>
<div class="stats" id="stats"></div><div id="panels"></div><div id="logical"></div><div id="toast"></div>
<div id="timeline"><div class="timehead"><span>KNOWLEDGE TIMELINE</span><span>点击事件定位节点</span></div><div class="events" id="events"></div></div>
<div id="knowledgeEditor" style="position:fixed;z-index:9;inset:0;background:#02040be8;display:none;align-items:center;justify-content:center"><div class="dialog"><h2>输入新知识 · 自动整理进知识宇宙</h2><label>粘贴一段知识、文章摘录或学习笔记（可分段）</label><textarea id="knowledgeText" style="height:210px" placeholder="请粘贴知识内容；可用换行分隔不同主题。"></textarea><div class="actions"><button class="btn" id="cancelKnowledge">取消</button><button class="btn" id="processKnowledge">整理并加入宇宙</button></div><p style="font-size:10px;color:#8794b8;line-height:1.6">当前版本在浏览器本地按段落与句子拆分知识节点，生成四向思考初稿，并按关键词重合建立初步关系；不调用云端 AI，结果可继续编辑。</p></div></div><div id="importDialog" style="position:fixed;z-index:10;inset:0;background:#02040be8;display:none;align-items:center;justify-content:center"><div class="dialog"><h2>导入知识结构</h2><p class="help">选择导入内容类型。支持 JSON 文件；混合导入会尝试匹配节点、层级、逻辑关系和四向思维线。</p><div class="import-options"><label><input type="radio" name="importMode" value="logic" checked> <span><b>只导入逻辑链</b><br><small>知识节点、一级/二级/三级层级、父子与逻辑连线</small></span></label><label><input type="radio" name="importMode" value="thought"> <span><b>只导入思维线</b><br><small>前瞻、顾后、左顾、右盼，并匹配已有节点</small></span></label><label><input type="radio" name="importMode" value="mixed"> <span><b>混合导入</b><br><small>同时导入逻辑链和思维线，自动识别层级并建立对应关系</small></span></label></div><div class="actions"><button class="btn" id="cancelImport">取消</button><button class="btn" id="chooseImportFile">选择 JSON 文件</button></div></div></div><div id="editor"><div class="dialog"><h2 id="editorTitle">创建知识节点</h2><label>节点名称</label><input id="nodeName" placeholder="例如：系统思维"><label>简短描述</label><textarea id="nodeDesc" placeholder="这个知识点的核心是什么？"></textarea><label>所属上级节点（留空即一级主干）</label><select id="nodeParent"><option value="">无上级 · 一级主干</option></select><label>前瞻 · 前置知识</label><textarea id="nodeBefore"></textarea><label>顾后 · 后续影响</label><textarea id="nodeAfter"></textarea><label>左顾 · 横向关联</label><textarea id="nodeLeft"></textarea><label>右盼 · 反向思考</label><textarea id="nodeRight"></textarea><div class="actions"><button class="btn" id="cancelEdit">取消</button><button class="btn" id="saveNode">保存节点</button></div></div></div>

 const place=(parent,depth)=>{const kids=childrenOf(parent),count=kids.length;if(!count)return;const radius=depth===1?Math.max(7,Math.min(15,count*2.5)):Math.max(4.5,Math.min(9,count*1.8));kids.forEach((child,i)=>{const angle=(Math.PI*2*i/Math.max(count,1))+(depth*.37);child.x=parent.x+Math.cos(angle)*radius;child.y=parent.y+(depth===1?(i%2?3:-3):(i%2?2:-2));child.z=parent.z+Math.sin(angle)*radius;place(child,depth+1);});};
 roots.forEach(root=>place(root,1));
}

function formatThought(raw){
 const lines=String(raw||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
 if(!lines.length)return '<p class="thought-detail">尚未填写</p>';
 let lead=lines.shift().replace(/^【重点】/,'').trim();
 if(lines.length===0){const parts=lead.split(/(?<=[。！？.!?；;])/).map(x=>x.trim()).filter(Boolean);if(parts.length>1){lead=parts.shift();lines.push(...parts);}}
 const detail=lines.map(x=>{const clean=x.replace(/^【细分】/,'').trim();const split=clean.match(/^([^：:]{2,14}[：:])(.*)$/);return '<p>'+(split?'<span class="detail-label">'+esc(split[1])+'</span><span>'+esc(split[2])+'</span>':'<span>'+esc(clean)+'</span>')+'</p>';}).join('');
 return '<div class="thought-content"><div class="thought-main"><strong>'+esc(lead)+'</strong></div>'+(detail?'<div class="thought-detail">'+detail+'</div>':'')+'</div>';
}

function normDirection(raw){const map={before:'before',prerequisite:'before',prerequisites:'before',前瞻:'before',前置:'before',after:'after',consequence:'after',consequences:'after',顾后:'after',后续:'after',left:'left',lateral:'left',左顾:'left',right:'right',counterpoint:'right',反向:'right',右盼:'right'};return map[String(raw||'').toLowerCase()]||null;}
function collectRecords(parsed){
 const raw=Array.isArray(parsed)?parsed:(parsed.nodes||parsed.logicChain||parsed.logicalChains||parsed.items||parsed.hierarchy||[]);
 if(!Array.isArray(raw))return [];
 const flat=[];const walk=(items,parentId=null)=>items.forEach(item=>{if(!item||typeof item!=='object')return;const copy={...item};delete copy.children;if(parentId&&copy.parentId==null&&copy.parent_id==null&&copy.parent==null)copy.parentId=parentId;flat.push(copy);const id=copy.id||copy.name||copy.title||copy.label;if(Array.isArray(item.children))walk(item.children,id);});
 walk(raw);return flat;
}
function importKnowledgeData(parsed,mode){
 const incoming=collectRecords(parsed),thoughts=parsed.thoughtLines||parsed.mindLines||parsed.thoughts||[];
 const findNode=t=>nodes.find(n=>n.id===t.nodeId||n.id===t.node_id||n.name===t.nodeName||n.name===t.node||n.name===t.name);
 const normName=v=>String(v||'').normalize('NFKC').toLowerCase().replace(/[\\s\\p{P}\\p{S}]+/gu,'');
 const bigrams=v=>{const a=Array.from(normName(v));const out=new Set();for(let i=0;i<a.length-1;i++)out.add(a[i]+a[i+1]);if(!out.size&&a.length)out.add(a[0]);return out;};
 const similarity=(a,b)=>{const A=bigrams(a),B=bigrams(b);if(!A.size||!B.size)return 0;let hit=0;A.forEach(x=>{if(B.has(x))hit++;});return 2*hit/(A.size+B.size);};
 const mergeText=(oldValue,newValue)=>{const a=String(oldValue||'').trim(),b=String(newValue||'').trim();if(!b)return a;if(!a)return b;if(normName(a)===normName(b)||a.includes(b))return a;return a+'\\n\\n【补充】'+b;};
 let added=0,updated=0,merged=0,thoughtUpdated=0;const idMap=new Map(),now=Date.now(),pending=[];
 if(mode!=='thought'){
  incoming.forEach((raw,i)=>{
   if(!raw||typeof raw!=='object')return;
   const name=String(raw.name||raw.title||raw.label||raw.text||'').trim();if(!name)return;
   const rawId=String(raw.id||('imp-'+now+'-'+i));
   let existing=nodes.find(n=>String(n.id)===rawId)||nodes.find(n=>normName(n.name)===normName(name));
   if(!existing){
    const candidates=nodes.map(n=>({n,score:similarity(n.name,name)})).filter(x=>x.score>=.92).sort((a,b)=>b.score-a.score);
    if(candidates.length===1)existing=candidates[0].n;
    else if(candidates.length>1)pending.push({name,candidates:candidates.slice(0,3).map(x=>x.n.name)});
   }
   const id=existing?.id||rawId;
   if(existing){
    const fields=['desc','before','after','left','right','sourceNote'];
    fields.forEach(k=>{const v=raw[k]??(k==='desc'?raw.description||raw.content:undefined);if(v!==undefined)existing[k]=mergeText(existing[k],v);});
    if(raw.date&&!existing.date)existing.date=raw.date;
    if(raw.confidence)existing.confidence=mergeText(existing.confidence,raw.confidence);
    if(raw.needsReview===true)existing.needsReview=true;
    if(raw.aliases)existing.aliases=[...new Set([...(existing.aliases||[]),...(Array.isArray(raw.aliases)?raw.aliases:[raw.aliases])])];
    merged++;updated++;
   }else{
    const n={...raw,id,name,desc:raw.desc||raw.description||raw.content||'',x:Number(raw.x??(Math.cos(i*2.4)*(15+i*2))),y:Number(raw.y??((i%3-1)*7)),z:Number(raw.z??(Math.sin(i*2.4)*(15+i*2))),color:raw.color??0x76dfff,date:raw.date||'导入'};
    nodes.push(n);added++;
   }
   idMap.set(rawId,id);idMap.set(String(raw.id||name),id);idMap.set(name,id);
   (raw.aliases||[]).forEach(a=>idMap.set(String(a),id));
   pending.push(...(raw._pending||[]));
  });
  const rawLinks=parsed.links||parsed.edges||[];
  rawLinks.forEach(l=>{const a=Array.isArray(l)?l[0]:(l.source||l.from||l.parentId),b=Array.isArray(l)?l[1]:(l.target||l.to||l.childId);const aa=idMap.get(String(a))||a,bb=idMap.get(String(b))||b;if(aa&&bb&&nodes.some(n=>n.id===aa)&&nodes.some(n=>n.id===bb)&&aa!==bb&&!links.some(x=>(Array.isArray(x)?x[0]:x.source||x.from)===aa&&(Array.isArray(x)?x[1]:x.target||x.to)===bb))links.push([aa,bb]);});
  // Restore parent-child hierarchy only after every imported ID has been mapped to its canonical node.
  incoming.forEach(raw=>{const child=idMap.get(String(raw.id||raw.name||raw.title));const parentKey=raw.parentId??raw.parent_id??raw.parent;const parent=parentKey==null?null:(idMap.get(String(parentKey))||nodes.find(n=>String(n.id)===String(parentKey)||normName(n.name)===normName(parentKey))?.id);const target=nodes.find(n=>n.id===child);if(target&&parent&&parent!==child){target.parentId=parent;}else if(target&&!target.parentId&&Number(raw.level||1)===1){target.parentId=null;}});
  normalizeHierarchy();
  if(mode==='logic')return {added,updated,merged,thoughtUpdated,pending};
 }
 if(mode!=='logic'){
  const list=[...thoughts,...incoming.filter(n=>n.thoughtLines||n.mindLines||n.before||n.after||n.left||n.right)];
  list.forEach(t=>{const target=findNode(t)||nodes.find(n=>n.id===idMap.get(String(t.nodeId||t.node_id||'')))||nodes.find(n=>n.name===String(t.nodeName||t.node||t.name||'').trim());if(!target)return;let changed=false;const src=t.thoughtLines||t.mindLines||t.thoughts||t;if(Array.isArray(src)){src.forEach(x=>{const d=normDirection(x.direction||x.type||x.name);if(d&&x.content){target[d]=mergeText(target[d],x.content);changed=true;}});}else{Object.entries(src).forEach(([k,v])=>{const d=normDirection(k);if(d&&typeof v==='string'){target[d]=mergeText(target[d],v);changed=true;}});}if(changed)thoughtUpdated++;});
 }
 return {added,updated,merged,thoughtUpdated,pending};
}

function keywords(s){return (s.match(/[\u4e00-\u9fff]{2,}|[A-Za-z0-9]{3,}/g)||[]).map(x=>x.toLowerCase()).filter(x=>!['这个','因为','所以','我们','他们','以及','可以','通过','一个','进行','对于','这种','如果','但是','the','and','that','with'].includes(x));}
function ingestKnowledge(raw){
 const blocks=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);let chunks=[];
 blocks.forEach(b=>{if(b.length>180){chunks.push(...b.split(/(?<=[。！？.!?；;])/).map(x=>x.trim()).filter(Boolean));}else chunks.push(b);});
 chunks=chunks.filter(x=>x.length>=8).slice(0,20);if(!chunks.length)throw new Error('内容太短，请输入至少一个完整知识句子或段落');
 const created=chunks.map((txt,i)=>{const title=(txt.match(/^.{2,28}?(?=[，。；：、,.;:!?]|$)/)||[txt.slice(0,24)])[0].replace(/[。；：，、,.;:!?]+$/,'').trim()||('新知识 '+(i+1));const angle=Date.now()/1000+i*2.4;const radius=18+Math.sqrt(nodes.length+i)*2.4;return{id:'k'+Date.now()+'-'+i,name:title.slice(0,32),desc:txt,before:'前置线索：'+(i>0?chunks[i-1].slice(0,100):'关键词 '+keywords(txt).slice(0,5).join('、')+' 可作为追溯背景与基础概念的线索。'),after:'后续思考：这条知识可能如何影响后续概念、实践或决策？请结合上下文补充具体结果。',left:'横向关联线索：'+keywords(txt).slice(0,6).join('、')+'。可与知识宇宙中相近主题进行比较。',right:'反向检验：这一观点成立的条件是什么？是否存在反例、边界或替代解释？',x:Math.cos(angle)*radius,y:(Math.random()-.5)*22,z:Math.sin(angle)*radius,color:[0x76dfff,0xb59aff,0x78a8ff,0x78e2c2,0xe19bff][(nodes.length+i)%5],date:new Date().getFullYear()+' · 新增'};});
 created.forEach((n,i)=>{nodes.push(n);if(i>0)links.push([created[i-1].id,n.id]);});
 if(selected&&created.length)links.push([selected.id,created[0].id]);
 created.forEach(n=>{const kw=new Set(keywords(n.desc));const ranked=nodes.filter(o=>o.id!==n.id&&!created.some(v=>v.id===o.id)).map(o=>({o,score:keywords((o.name||'')+' '+(o.desc||'')).filter(k=>kw.has(k)).length})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,2);ranked.forEach(x=>links.push([n.id,x.o.id]));});
 persist();build();select(created[0]);return created.length;
}
